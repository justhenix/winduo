name: Build and release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Publish single exe
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime ${{ matrix.runtime }}
      - name: Test x64
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/WinDuo-win-x64.exe -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden
          Get-Content ./artifacts/self-test.txt
          if ($process.ExitCode -ne 0) { throw 'Self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: WinDuo-${{ matrix.runtime }}
          path: |
            artifacts/WinDuo-${{ matrix.runtime }}.exe
            artifacts/WinDuo-${{ matrix.runtime }}.exe.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "WinDuo $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
          fi
